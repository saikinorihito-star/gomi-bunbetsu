<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12392e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="分別辞典">
  <meta name="description" content="自治体の公式資料を取り込む、ごみ分別検索アプリ">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>ごみ分別辞典</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="seed-data.js"></script>
  <script defer src="app.js"></script>
  <script defer src="photo-ai.js"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><div class="brandicon" aria-hidden="true">♻</div><div><div class="brandtitle">ごみ分別辞典</div><div class="brandcaption">自治体の公式資料から調べる</div></div></div>
      <button id="openSettings" class="iconbutton" aria-label="設定を開く" title="設定"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm8.5-3.5a7.5 7.5 0 0 0-.12-1.31l1.76-1.38-1.72-2.98-2.09.84a8.4 8.4 0 0 0-2.27-1.31l-.32-2.22h-3.44l-.32 2.22a8.4 8.4 0 0 0-2.27 1.31l-2.09-.84-1.72 2.98 1.76 1.38a7.6 7.6 0 0 0 0 2.62L5.9 14.7l1.72 2.98 2.09-.84a8.4 8.4 0 0 0 2.27 1.31l.32 2.22h3.44l.32-2.22a8.4 8.4 0 0 0 2.27-1.31l2.09.84 1.72-2.98-1.76-1.38c.08-.43.12-.87.12-1.32Z" transform="translate(-2 -1)" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linejoin="round"/></svg></button>
    </header>
    <main>
      <section class="hero" aria-label="検索">
        <div class="eyebrow">選択中の自治体</div>
        <button id="cityPicker" class="citypicker"><span id="cityLabel">富山県高岡市</span><span class="chevron">⌄</span></button>
        <h1>これ、何ごみ？</h1>
        <p>捨てたいものの名前を入力してください。</p>
        <label class="searchfield" for="searchInput">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
          <input id="searchInput" type="search" autocomplete="off" enterkeyhint="search" placeholder="例：モバイルバッテリー、スプレー缶">
        </label>
        <button type="button" id="openPhoto" class="photo-launch"><span aria-hidden="true">📷</span><span><strong>写真から品目を調べる</strong><small>撮影・アルバムから判別候補を表示</small></span><span class="photo-chevron">›</span></button>
        <div class="chips" id="quickChips" aria-label="よく検索される品目"></div>
      </section>
      <div id="content" class="content" aria-live="polite"></div>
      <div class="disclaimer">分別情報は自治体により異なります。危険物や例外品は、出す前に必ずリンク先の公式案内を確認してください。</div>
    </main>
    <nav class="bottomnav" aria-label="メインメニュー">
      <button data-tab="search" class="navbtn active"><span class="navicon">⌕</span><span>さがす</span></button>
      <button data-tab="favorites" class="navbtn"><span class="navicon">☆</span><span>お気に入り</span></button>
      <button data-tab="sources" class="navbtn"><span class="navicon">▤</span><span>資料・設定</span></button>
    </nav>
  </div>
  <div id="overlay" class="overlay hidden" role="presentation"></div>
  <input type="file" accept="image/*" capture="environment" id="photoCamera" hidden aria-label="カメラで撮影">
  <input type="file" accept="image/*" id="photoLibrary" hidden aria-label="写真を選択">
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
